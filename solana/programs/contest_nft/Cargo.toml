[package]
name = "contest_nft"
version = "0.1.0"
description = "Contest join and certificate registry program"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "contest_nft"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.32.1"
anchor-spl = { version = "0.32.1", features = ["token", "associated_token", "metadata"] }
solana-sha256-hasher = "2.3.0"
zeroize = "=1.8.1"
