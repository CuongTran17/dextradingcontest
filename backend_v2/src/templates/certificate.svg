<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <rect width="1600" height="1000" fill="#0f172a"/>
  <rect x="80" y="80" width="1440" height="840" rx="32" fill="#f8fafc"/>
  <text x="800" y="190" text-anchor="middle" font-family="Arial" font-size="54" font-weight="700" fill="#111827">Crypto DEX Trading Contest</text>
  <text x="800" y="280" text-anchor="middle" font-family="Arial" font-size="42" fill="#0f172a">{{ contest_title }}</text>
  <text x="800" y="410" text-anchor="middle" font-family="Arial" font-size="96" font-weight="700" fill="#2563eb">Top {{ rank }}</text>
  <text x="800" y="510" text-anchor="middle" font-family="Arial" font-size="52" font-weight="700" fill="#111827">{{ recipient_name }}</text>
  <text x="800" y="590" text-anchor="middle" font-family="Arial" font-size="30" fill="#475569">{{ wallet_short }}</text>
  <text x="800" y="690" text-anchor="middle" font-family="Arial" font-size="34" fill="#111827">{{ final_equity }} | ROI {{ roi }}</text>
  <text x="800" y="775" text-anchor="middle" font-family="Arial" font-size="26" fill="#64748b">Settled {{ settlement_date }} | Snapshot {{ snapshot_short }}</text>
</svg>
